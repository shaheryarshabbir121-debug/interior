<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
<defs>

  <!-- Growth arrow marker -->
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <polygon points="0,0.5 8,4.5 0,8.5" fill="#c9a84c"/>
  </marker>

  <!-- Elegant narrow leaf (tip at 0,-22, base at 0,0) -->
  <path id="lf"
    d="M0,0 C-3.5,-5 -4,-14 0,-22 C4,-14 3.5,-5 0,0Z"/>

  <!-- Top arc text path (CCW from left through top, r=210) -->
  <path id="ta" d="M 40,250 A 210,210 0 0,0 460,250" fill="none"/>

  <!-- Bottom arc text path (CCW from right through bottom, r=210) -->
  <path id="ba" d="M 460,250 A 210,210 0 0,0 40,250" fill="none"/>

</defs>

<!-- ================================================================
     SEAL BACKGROUND
     ================================================================ -->
<circle cx="250" cy="250" r="244" fill="#0b1a3a"/>

<!-- Outer gold band rings -->
<circle cx="250" cy="250" r="242" fill="none" stroke="#c9a84c" stroke-width="3"/>
<circle cx="250" cy="250" r="235" fill="none" stroke="#c9a84c" stroke-width="0.8"/>

<!-- Inner ring (icon boundary) -->
<circle cx="250" cy="250" r="187" fill="none" stroke="#c9a84c" stroke-width="2.5"/>
<circle cx="250" cy="250" r="181" fill="none" stroke="#c9a84c" stroke-width="0.6"/>

<!-- ================================================================
     CIRCULAR TEXT
     ================================================================ -->
<text font-family="Arial, Helvetica, sans-serif"
      font-size="20" font-weight="700" fill="#ffffff" letter-spacing="3.2">
  <textPath href="#ta" startOffset="7%">SCHOOL EDUCATION DEPARTMENT PUNJAB</textPath>
</text>

<text font-family="Arial, Helvetica, sans-serif"
      font-size="18" font-weight="600" fill="#ffffff" letter-spacing="2.5">
  <textPath href="#ba" startOffset="8%">STRATEGIC MANAGEMENT UNIT  ·  SMU</textPath>
</text>

<!-- Dot separators at left & right mid-points of text band -->
<circle cx="41"  cy="250" r="3" fill="#c9a84c"/>
<circle cx="459" cy="250" r="3" fill="#c9a84c"/>

<!-- ================================================================
     LAUREL WREATHS  (inside inner ring, lower portion)
     Leaves point radially outward; rotation = atan2(dy,dx)+90°
     ================================================================ -->

<!-- ---- LEFT WREATH stem ---- -->
<path d="M 104,283 C 122,328 163,376 210,400"
      fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>

<!-- Left primary leaves  (θ+90° rotations) -->
<use href="#lf" transform="translate(210,400) rotate(196)" fill="#c9a84c"/>
<use href="#lf" transform="translate(182,385) rotate(209)" fill="#c9a84c"/>
<use href="#lf" transform="translate(156,366) rotate(222)" fill="#c9a84c"/>
<use href="#lf" transform="translate(132,341) rotate(235)" fill="#c9a84c"/>
<use href="#lf" transform="translate(115,313) rotate(248)" fill="#c9a84c"/>
<use href="#lf" transform="translate(104,283) rotate(261)" fill="#c9a84c"/>

<!-- Left secondary leaves (smaller, offset outward) -->
<use href="#lf" transform="translate(198,411) rotate(199) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(169,395) rotate(212) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(143,376) rotate(225) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(121,350) rotate(238) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(107,323) rotate(251) scale(0.7)" fill="#c9a84c"/>

<!-- ---- RIGHT WREATH stem ---- -->
<path d="M 396,283 C 378,328 337,376 290,400"
      fill="none" stroke="#c9a84c" stroke-width="1.8" stroke-linecap="round"/>

<!-- Right primary leaves -->
<use href="#lf" transform="translate(290,400) rotate(164)" fill="#c9a84c"/>
<use href="#lf" transform="translate(318,385) rotate(151)" fill="#c9a84c"/>
<use href="#lf" transform="translate(344,366) rotate(138)" fill="#c9a84c"/>
<use href="#lf" transform="translate(368,341) rotate(125)" fill="#c9a84c"/>
<use href="#lf" transform="translate(385,313) rotate(112)" fill="#c9a84c"/>
<use href="#lf" transform="translate(396,283) rotate( 99)" fill="#c9a84c"/>

<!-- Right secondary leaves -->
<use href="#lf" transform="translate(302,411) rotate(161) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(331,395) rotate(148) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(357,376) rotate(135) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(379,350) rotate(122) scale(0.7)" fill="#c9a84c"/>
<use href="#lf" transform="translate(393,323) rotate(109) scale(0.7)" fill="#c9a84c"/>

<!-- Ribbon knot at bottom center -->
<path d="M 216,403 C 230,412 245,415 250,414 C 255,415 270,412 284,403"
      fill="none" stroke="#c9a84c" stroke-width="2.2" stroke-linecap="round"/>
<circle cx="250" cy="414" r="4" fill="#c9a84c"/>

<!-- ================================================================
     OPEN BOOK  (base of icon, y ≈ 295–330)
     ================================================================ -->
<!-- Left page -->
<path d="M 248,296 L 172,312 L 172,332 L 248,318 Z" fill="#e8e8ee"/>
<!-- Right page -->
<path d="M 252,296 L 328,312 L 328,332 L 252,318 Z" fill="#ffffff"/>
<!-- Gold spine -->
<line x1="248" y1="296" x2="248" y2="318" stroke="#c9a84c" stroke-width="3"/>
<line x1="252" y1="296" x2="252" y2="318" stroke="#c9a84c" stroke-width="3"/>
<!-- Curved binding at base -->
<path d="M 172,332 Q 250,345 328,332"
      fill="none" stroke="#c9a84c" stroke-width="2.2"/>
<!-- Page edge lines -->
<line x1="172" y1="312" x2="172" y2="332" stroke="#c9a84c" stroke-width="1.8"/>
<line x1="328" y1="312" x2="328" y2="332" stroke="#c9a84c" stroke-width="1.8"/>
<!-- Gold page rules (horizontal lines on pages for elegance) -->
<line x1="178" y1="320" x2="245" y2="315" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
<line x1="178" y1="325" x2="245" y2="320" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
<line x1="255" y1="315" x2="322" y2="320" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
<line x1="255" y1="320" x2="322" y2="325" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>

<!-- ================================================================
     CITY SKYLINE  (white buildings rising from book spine)
     ================================================================ -->

<!-- Building A — left, medium height -->
<rect x="208" y="210" width="30" height="86" fill="#ffffff" rx="1.5"/>
<!-- Roof ridge A -->
<rect x="208" y="208" width="30" height="4" fill="#c9a84c" rx="1"/>
<!-- Windows A (2 col × 3 row) -->
<rect x="214" y="218" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="224" y="218" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="214" y="231" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="224" y="231" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="214" y="244" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="224" y="244" width="7" height="8" fill="#0b1a3a" rx="0.5"/>

<!-- Building B — center, tallest, with triangular peak -->
<polygon points="250,156 236,178 264,178" fill="#ffffff"/>
<rect x="236" y="178" width="28" height="118" fill="#ffffff" rx="1.5"/>
<!-- Roof ridge B -->
<rect x="236" y="176" width="28" height="4" fill="#c9a84c" rx="1"/>
<!-- Windows B (2 col × 4 row) -->
<rect x="241" y="186" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="251" y="186" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="241" y="198" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="251" y="198" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="241" y="210" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="251" y="210" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="241" y="222" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<rect x="251" y="222" width="6" height="7" fill="#0b1a3a" rx="0.5"/>
<!-- Gold beacon at spire tip -->
<circle cx="250" cy="154" r="4" fill="#c9a84c"/>

<!-- Building C — right, medium-tall -->
<rect x="262" y="198" width="30" height="98" fill="#ffffff" rx="1.5"/>
<!-- Roof ridge C -->
<rect x="262" y="196" width="30" height="4" fill="#c9a84c" rx="1"/>
<!-- Windows C (2 col × 3 row) -->
<rect x="268" y="206" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="278" y="206" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="268" y="219" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="278" y="219" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="268" y="232" width="7" height="8" fill="#0b1a3a" rx="0.5"/>
<rect x="278" y="232" width="7" height="8" fill="#0b1a3a" rx="0.5"/>

<!-- Ground baseline between buildings and book -->
<line x1="200" y1="296" x2="300" y2="296"
      stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

<!-- ================================================================
     GROWTH ARROW (gold diagonal, symbolising progress)
     ================================================================ -->
<line x1="196" y1="276" x2="276" y2="188"
      stroke="#c9a84c" stroke-width="4.5"
      stroke-linecap="round"
      marker-end="url(#arr)"/>

</svg>
