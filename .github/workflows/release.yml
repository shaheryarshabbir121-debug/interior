name: Build Windows App & Release

on:
  push:
    branches: [claude/eloquent-shannon-lskpfx]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Vite app
        run: npm run build

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Pakistan Minutes Assistant v1.0.${{ github.run_number }}"
          body: |
            ## Pakistan Meeting Minutes Assistant — Windows Desktop App

            ### How to install:
            1. Download **Pakistan-Minutes-Assistant-Setup.exe** below
            2. Double-click it and follow the installer
            3. Launch the app from your Desktop or Start Menu
            4. Paste your Anthropic API key in the yellow box and click Save

            > Windows may show a SmartScreen warning — click **More info → Run anyway**
          files: |
            release/*.exe
            release/*.zip
          draft: false
          prerelease: false
