<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Metallic silver gradient -->
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e8e8e8"/>
      <stop offset="40%"  stop-color="#c0c0c0"/>
      <stop offset="60%"  stop-color="#a8a8a8"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
    <!-- Deep forest green gradient for crest body -->
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1e3d2f"/>
      <stop offset="100%" stop-color="#0d2318"/>
    </linearGradient>
    <!-- Path for circular text -->
    <path id="topArc"
      d="M 250,250
         m -170,0
         a 170,170 0 1,1 340,0"
      fill="none"/>
    <path id="bottomArc"
      d="M 250,250
         m -170,0
         a 170,170 0 0,0 340,0"
      fill="none"/>
  </defs>

  <!-- White background -->
  <rect width="500" height="500" fill="#ffffff"/>

  <!-- Outer ring / seal border -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#silver)" stroke-width="6"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#1e3d2f"     stroke-width="2"/>

  <!-- Main crest body -->
  <circle cx="250" cy="250" r="195" fill="url(#green)"/>

  <!-- Inner ring accent -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="url(#silver)" stroke-width="2.5"/>

  <!-- ============================================================
       Interlocking SMU Monogram — scaled up, centered as a group
       The group origin is the visual center of S+M+U combined.
       S spans x: -162 to -62  (width ~100)
       M spans x:  -56 to  56  (width ~112)
       U spans x:   62 to 162  (width ~100)
       Total width: 324 → center offset = 0
       Height: -88 to +72 → vertical center = -8
       Scale 1.35 applied to fill the crest nicely.
       ============================================================ -->
  <g transform="translate(250,248) scale(1.35)">

    <!-- === S === -->
    <path d="
      M -152,-44
      Q -152,-70 -130,-70
      L  -90,-70
      Q  -70,-70 -70,-52
      Q  -70,-34  -92,-34
      L -116,-34
      Q -144,-34 -144,-12
      Q -144,  8 -116,  8
      L  -78,  8
      Q  -56,  8  -56, 28
      Q  -56, 52  -82, 52
      L -118, 52
      Q -144, 52 -144, 30
    " fill="none" stroke="url(#silver)" stroke-width="14"
       stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="-160" y1="-70" x2="-142" y2="-70" stroke="url(#silver)" stroke-width="5"/>
    <line x1="-158" y1=" 30" x2="-130" y2=" 30" stroke="url(#silver)" stroke-width="5"/>

    <!-- === M === (centered at x=0) -->
    <path d="
      M -50,-70
      L -50, 56
      M -50,-70
      L   0,-14
      L  50,-70
      M  50,-70
      L  50, 56
    " fill="none" stroke="url(#silver)" stroke-width="14"
       stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1="-62" y1="-70" x2="-38" y2="-70" stroke="url(#silver)" stroke-width="5"/>
    <line x1="-62" y1=" 56" x2="-38" y2=" 56" stroke="url(#silver)" stroke-width="5"/>
    <line x1=" 38" y1="-70" x2=" 62" y2="-70" stroke="url(#silver)" stroke-width="5"/>
    <line x1=" 38" y1=" 56" x2=" 62" y2=" 56" stroke="url(#silver)" stroke-width="5"/>

    <!-- === U === -->
    <path d="
      M  62,-70
      L  62, 12
      Q  62, 56 112, 56
      Q 162, 56 162, 12
      L 162,-70
    " fill="none" stroke="url(#silver)" stroke-width="14"
       stroke-linecap="square" stroke-linejoin="miter"/>
    <line x1=" 50" y1="-70" x2=" 74" y2="-70" stroke="url(#silver)" stroke-width="5"/>
    <line x1="150" y1="-70" x2="174" y2="-70" stroke="url(#silver)" stroke-width="5"/>
    <line x1=" 90" y1=" 56" x2="134" y2=" 56" stroke="url(#silver)" stroke-width="5"/>

  </g>

  <!-- Thin horizontal divider line under monogram -->
  <line x1="140" y1="328" x2="360" y2="328" stroke="url(#silver)" stroke-width="1.5"/>

  <!-- ============================================================
       Circular text — "STRATEGIC MANAGEMENT UNIT"
       ============================================================ -->

  <!-- Top arc text -->
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="17" font-weight="700"
        fill="url(#silver)" letter-spacing="3.5">
    <textPath href="#topArc" startOffset="4%">
      STRATEGIC MANAGEMENT UNIT
    </textPath>
  </text>

  <!-- Bottom arc — decorative dots / rule -->
  <text font-family="Georgia, 'Times New Roman', serif"
        font-size="14" font-weight="400"
        fill="url(#silver)" letter-spacing="8">
    <textPath href="#bottomArc" startOffset="10%">
      ✦ · · · · · · · · · · · ✦
    </textPath>
  </text>

  <!-- Small crown / crest ornament above monogram -->
  <g transform="translate(250,120)" fill="url(#silver)">
    <polygon points="0,-18 -5,-8 -16,-8 -8,0 -12,12 0,5 12,12 8,0 16,-8 5,-8" />
  </g>

  <!-- Two small ornamental stars flanking divider -->
  <text x="148" y="325" font-size="10" fill="url(#silver)" text-anchor="middle">✦</text>
  <text x="352" y="325" font-size="10" fill="url(#silver)" text-anchor="middle">✦</text>
</svg>
