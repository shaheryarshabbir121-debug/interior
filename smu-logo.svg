<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <linearGradient id="navy-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f3880"/>
      <stop offset="100%" stop-color="#0f1f50"/>
    </linearGradient>
    <linearGradient id="gold-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e0bb6a"/>
      <stop offset="50%"  stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a8841e"/>
    </linearGradient>
    <!-- M letter interior triangle for building clip -->
    <clipPath id="m-notch-clip">
      <polygon points="296,92 350,193 404,92"/>
    </clipPath>
  </defs>

  <!-- White background -->
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- Top gold accent bar -->
  <rect x="100" y="80" width="500" height="4" fill="url(#gold-shine)" rx="2"/>

  <!-- ================================================================
       S  LETTER  (center ~x=148, y: 88–285)
       Constructed as two stacked C-arcs forming a bold sans-serif S
       ================================================================ -->
  <!-- Top arc of S: opens right at top -->
  <path d="
    M 192,117
    C 192,94  174,86  152,86
    L 116,86
    C  88,86   76,102  76,122
    C  76,142  90,152 118,160
    L 162,170
    C 192,178 206,192 206,216
    C 206,240 190,252 162,252
    L 114,252
    C  84,252  74,236  74,218
  "
  fill="none" stroke="url(#navy-shade)" stroke-width="30"
  stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- ================================================================
       M  LETTER  (center x=350, y: 88–285)
       Filled polygon so we can clip buildings inside V-notch
       ================================================================ -->
  <!-- M outer shape (filled navy) -->
  <polygon
    points="255,285 255,88 350,200 445,88 445,285 415,285 415,106 350,218 285,106 285,285"
    fill="url(#navy-shade)"/>

  <!-- Buildings inside V-notch (navy, clipped to white triangle) -->
  <g clip-path="url(#m-notch-clip)">
    <!-- Sky background inside notch -->
    <polygon points="296,92 350,193 404,92" fill="#f0f4ff"/>

    <!-- Building 1 (left) -->
    <rect x="300" y="142" width="24" height="52" fill="url(#navy-shade)"/>
    <!-- Windows B1 -->
    <rect x="305" y="148" width="5" height="5" fill="#c9a84c"/>
    <rect x="314" y="148" width="5" height="5" fill="#c9a84c"/>
    <rect x="305" y="158" width="5" height="5" fill="#c9a84c"/>
    <rect x="314" y="158" width="5" height="5" fill="#c9a84c"/>

    <!-- Building 2 (left-center) -->
    <rect x="326" y="118" width="20" height="76" fill="url(#navy-shade)"/>
    <!-- Flat roof detail -->
    <rect x="324" y="115" width="24" height="5" fill="url(#navy-shade)"/>
    <!-- Windows B2 -->
    <rect x="330" y="125" width="4" height="5" fill="#c9a84c"/>
    <rect x="338" y="125" width="4" height="5" fill="#c9a84c"/>
    <rect x="330" y="135" width="4" height="5" fill="#c9a84c"/>
    <rect x="338" y="135" width="4" height="5" fill="#c9a84c"/>
    <rect x="330" y="145" width="4" height="5" fill="#c9a84c"/>
    <rect x="338" y="145" width="4" height="5" fill="#c9a84c"/>

    <!-- Building 3 (center, tallest) -->
    <rect x="340" y="100" width="20" height="94" fill="url(#navy-shade)"/>
    <rect x="348" y="96"  width="6"  height="6"  fill="url(#navy-shade)"/>
    <!-- Windows B3 -->
    <rect x="344" y="108" width="4" height="4" fill="#c9a84c"/>
    <rect x="352" y="108" width="4" height="4" fill="#c9a84c"/>
    <rect x="344" y="117" width="4" height="4" fill="#c9a84c"/>
    <rect x="352" y="117" width="4" height="4" fill="#c9a84c"/>
    <rect x="344" y="126" width="4" height="4" fill="#c9a84c"/>
    <rect x="352" y="126" width="4" height="4" fill="#c9a84c"/>
    <rect x="344" y="135" width="4" height="4" fill="#c9a84c"/>
    <rect x="352" y="135" width="4" height="4" fill="#c9a84c"/>

    <!-- Building 4 (right-center) -->
    <rect x="354" y="122" width="20" height="72" fill="url(#navy-shade)"/>
    <rect x="352" y="118" width="24" height="5"  fill="url(#navy-shade)"/>
    <!-- Windows B4 -->
    <rect x="358" y="128" width="4" height="5" fill="#c9a84c"/>
    <rect x="366" y="128" width="4" height="5" fill="#c9a84c"/>
    <rect x="358" y="138" width="4" height="5" fill="#c9a84c"/>
    <rect x="366" y="138" width="4" height="5" fill="#c9a84c"/>
    <rect x="358" y="148" width="4" height="5" fill="#c9a84c"/>
    <rect x="366" y="148" width="4" height="5" fill="#c9a84c"/>

    <!-- Building 5 (right) -->
    <rect x="376" y="148" width="22" height="46" fill="url(#navy-shade)"/>
    <!-- Windows B5 -->
    <rect x="380" y="154" width="5" height="5" fill="#c9a84c"/>
    <rect x="389" y="154" width="5" height="5" fill="#c9a84c"/>
    <rect x="380" y="164" width="5" height="5" fill="#c9a84c"/>
    <rect x="389" y="164" width="5" height="5" fill="#c9a84c"/>

    <!-- Gold horizon line at building bases -->
    <line x1="296" y1="194" x2="404" y2="194" stroke="#c9a84c" stroke-width="2"/>
  </g>

  <!-- ================================================================
       U  LETTER  (center ~x=556, y: 88–285)
       Bold U with gold accent arc inside bowl
       ================================================================ -->
  <path d="M 508,88 L 508,222 C 508,264 530,285 558,285 C 586,285 608,264 608,222 L 608,88"
    fill="none" stroke="url(#navy-shade)" stroke-width="30" stroke-linecap="butt"/>

  <!-- Gold reflection arc inside U bowl -->
  <path d="M 527,222 C 527,254 541,268 558,268 C 575,268 589,254 589,222"
    fill="none" stroke="url(#gold-shine)" stroke-width="7" stroke-linecap="round"/>

  <!-- Subtle inner gold fill in U bottom -->
  <path d="M 527,240 C 527,262 541,275 558,275 C 575,275 589,262 589,240 L 589,270 C 589,280 575,290 558,290 C 541,290 527,280 527,270 Z"
    fill="#c9a84c" opacity="0.12"/>

  <!-- ================================================================
       TAGLINE + DECORATIVE RULES
       ================================================================ -->

  <!-- Gold rule line -->
  <line x1="100" y1="308" x2="600" y2="308" stroke="url(#gold-shine)" stroke-width="1.5"/>

  <!-- STRATEGIC MANAGEMENT UNIT -->
  <text
    x="350" y="338"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18.5"
    font-weight="700"
    letter-spacing="5.5"
    fill="url(#navy-shade)">STRATEGIC MANAGEMENT UNIT</text>

  <!-- Bottom gold rule -->
  <line x1="100" y1="356" x2="600" y2="356" stroke="url(#gold-shine)" stroke-width="1.5"/>

  <!-- Small gold diamond ornaments flanking tagline -->
  <polygon points="340,338 345,332 350,338 345,344" fill="none"/>
  <polygon points="88,332  94,326  100,332 94,338" fill="#c9a84c" opacity="0.7"/>
  <polygon points="600,332 606,326 612,332 606,338" fill="#c9a84c" opacity="0.7"/>

</svg>
